name: Build Android Music Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - feature/music-device-bridge
    paths:
      - "native/android/**"
      - ".github/workflows/build-android-bridge.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p native/android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ossv2-android-music-bridge-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
